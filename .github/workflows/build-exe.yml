name: build-exe
# Builds SVStudio.exe (the Windows launcher with a built-in Python) and commits it to the repo,
# so the in-app updater delivers it like any other file.
on:
  push:
    branches: [main]
    paths: ["launcher/**", ".github/workflows/build-exe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: bash
        run: |
          pip install pyinstaller==6.11.1
          # python3.dll: needed by "abi3" extension modules such as slang (pyslang.pyd)
          PYDIR=$(python -c "import sys, os; print(os.path.dirname(sys.executable))")
          # one-folder build: SVStudio.exe + runtime/ (nothing is unpacked to %TEMP% at start-up)
          pyinstaller --noconfirm --onedir --windowed --name SVStudio --icon launcher/svstudio.ico \
            --contents-directory runtime --add-binary "$PYDIR/python3.dll;." launcher/launcher.py
          rm -rf runtime
          cp dist/SVStudio/SVStudio.exe SVStudio.exe
          cp -r dist/SVStudio/runtime runtime
      - name: Smoke test (start, serve the UI, stop)
        shell: pwsh
        run: |
          $env:SVS_NO_UPDATE = "1"
          $p = Start-Process -FilePath .\SVStudio.exe -ArgumentList "--no-window","--port","8799" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/ ; if ($r.Content -match "SV Studio") { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Get-Content "$env:USERPROFILE\.svstudio.log" -ErrorAction SilentlyContinue; throw "SVStudio.exe did not start" }
          Write-Host "SVStudio.exe served the UI"
          # live check (slang) must load inside the exe
          $p = Start-Process -FilePath .\SVStudio.exe -ArgumentList "examples","--no-window","--port","8798" -PassThru
          Start-Sleep -Seconds 6
          $html = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8798/).Content
          $tok = [regex]::Match($html, 'SVS_TOKEN = "([0-9a-f]+)"').Groups[1].Value
          $st = ""
          for ($i = 0; $i -lt 10; $i++) {
            $st = (Invoke-WebRequest -UseBasicParsing -Method POST -Headers @{"X-SVS-Token"=$tok} -ContentType "application/json" -Body "{}" http://127.0.0.1:8798/api/lint).Content
            if ($st -match '"state": "(ok|off)"') { break }
            Start-Sleep -Seconds 2
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host $st.Substring(0, [Math]::Min(300, $st.Length))
          if ($st -notmatch '"state": "ok"') { throw "Live check (slang) doesn't load inside SVStudio.exe" }
          Get-Content "$env:USERPROFILE\.svstudio.log" -ErrorAction SilentlyContinue
      - name: Commit SVStudio.exe
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A SVStudio.exe runtime
          git diff --cached --quiet && exit 0
          git commit -m "Build SVStudio.exe [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
