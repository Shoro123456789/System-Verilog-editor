name: build-exe
# Builds SVStudio.exe (the Windows launcher with a built-in Python) and commits it to the repo,
# so the in-app updater delivers it like any other file.
on:
  push:
    branches: [main]
    paths: ["launcher/**", ".github/workflows/build-exe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: bash
        run: |
          pip install pyinstaller==6.11.1
          pyinstaller --noconfirm --onefile --windowed --name SVStudio --icon launcher/svstudio.ico launcher/launcher.py
          cp dist/SVStudio.exe SVStudio.exe
      - name: Smoke test (start, serve the UI, stop)
        shell: pwsh
        run: |
          $env:SVS_NO_UPDATE = "1"
          $p = Start-Process -FilePath .\SVStudio.exe -ArgumentList "--no-window","--port","8799" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/ ; if ($r.Content -match "SV Studio") { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Get-Content "$env:USERPROFILE\.svstudio.log" -ErrorAction SilentlyContinue; throw "SVStudio.exe did not start" }
          Write-Host "SVStudio.exe served the UI"
          Get-Content "$env:USERPROFILE\.svstudio.log" -ErrorAction SilentlyContinue
      - name: Commit SVStudio.exe
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SVStudio.exe
          git diff --cached --quiet && exit 0
          git commit -m "Build SVStudio.exe [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
